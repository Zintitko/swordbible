name: sword_drill
description: "Sword Bible: Drill Trivia — Daily Bible trivia and Scripture study."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^5.3.1
  shared_preferences: ^2.3.5
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/images/
